[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "lab-student-survey"
version = "1.0.0"
description = "Python package for lab student survey"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "click>=8.1.7",
  "japanize-matplotlib>=1.1.3",
  "matplotx>=0.3.10",
  "numpy>=1.26.4",
  "pandas>=2.1",
  "pdfkit>=1",
  "pingouin>=0.5.3",
  "pydrive2>=1.17",
  "setuptools>=77.0.3",
  "tqdm>=4.66.1",
  "xhtml2pdf>=0.2.11",
]
urls."Bug Tracker" = "https://github.com/34j/lab-student-survey/issues"
urls.Changelog = "https://github.com/34j/lab-student-survey/blob/main/CHANGELOG.md"
urls.documentation = "https://lab-student-survey.readthedocs.io"
urls.repository = "https://github.com/34j/lab-student-survey"
scripts.lab-student-survey = "lab_student_survey.cli:cli"
scripts.lss = "lab_student_survey.cli:cli"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
